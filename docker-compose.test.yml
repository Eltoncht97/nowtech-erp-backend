services:
  postgres-test:
    image: postgres:16-alpine
    container_name: nowtech-erp-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nowtech_erp_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nowtech_erp_test']
      interval: 5s
      timeout: 5s
      retries: 5
